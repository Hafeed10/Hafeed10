<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Muhammed Hafeed P - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0f1f3d" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#93c5fd"/>
    </pattern>
    <clipPath id="disc">
      <circle cx="720" cy="175" r="104"/>
    </clipPath>
    <clipPath id="figure">
      <ellipse cx="720" cy="142" rx="38" ry="46"/>
      <path d="M636,290 Q636,206 720,198 Q804,206 804,290 Z"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050b1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background + card -->
  <rect width="900" height="340" fill="#030712"/>
  <rect x="20" y="20" width="860" height="300" rx="14" fill="#050b1a" stroke="#1e3a8a" stroke-width="1.2"/>
  <rect x="20" y="20" width="860" height="300" rx="14" fill="url(#grid)"/>

  <!-- top labels -->
  <g font-family="'Courier New', monospace" font-size="10" letter-spacing="3">
    <text x="50" y="52" fill="#6b84b5">PROFILE / LIVING IDENTITY</text>
    <text x="850" y="52" fill="#6b84b5" text-anchor="end">@HAFEED10</text>
  </g>

  <!-- intro -->
  <text x="50" y="112" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#3b82f6">HELLO, WORLD. I'M</text>

  <!-- dotted-outline name -->
  <g font-family="'Courier New', monospace" font-weight="700" font-size="58" fill="#0b1630" stroke="#e2e8f0" stroke-width="1.6" stroke-dasharray="2 2.6">
    <text x="48" y="172">Muhammed</text>
    <text x="48" y="232">Hafeed P</text>
  </g>
  <rect x="290" y="204" width="14" height="30" fill="#3b82f6">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- role + location -->
  <text x="50" y="274" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#ffffff">Python / JavaScript / Django / React</text>
  <text x="50" y="298" font-family="'Courier New', monospace" font-size="11" fill="#6b84b5">India</text>

  <!-- right: dot-matrix portrait disc -->
  <circle cx="720" cy="175" r="130" fill="url(#glow)"/>
  <circle cx="720" cy="175" r="118" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 7">
    <animateTransform attributeName="transform" type="rotate" from="0 720 175" to="360 720 175" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="175" r="106" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.8"/>
  <g clip-path="url(#disc)">
    <rect x="600" y="55" width="240" height="240" fill="#071229"/>
    <g clip-path="url(#figure)">
      <rect x="600" y="55" width="240" height="240" fill="url(#dots)">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- orbit dot -->
  <circle cx="838" cy="175" r="3.5" fill="#3b82f6">
    <animateTransform attributeName="transform" type="rotate" from="0 720 175" to="360 720 175" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- status pill -->
  <g font-family="'Courier New', monospace" font-size="10" letter-spacing="2">
    <circle cx="630" cy="302" r="3" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="642" y="306" fill="#6b84b5">PROFILE · LIVE</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
